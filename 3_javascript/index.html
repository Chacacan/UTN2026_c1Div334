<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
    <style>
        /* Codigo CSS adentro de la etiqueta <style> */
            body {
                background-color: darkslateblue;
                color: white;
            }

            #contenedor-input, #padre {
                margin-top: 10px;
                border: 2px solid;
                padding: 10px;
                display: flex;
                flex-direction: column;
            }
                
    </style>


    <!-- Donde colocamos nuestro JavaScript? 
    OPCION 1 / Habitualmente la mejor, en el head, con el atributo defer 
    Primero se carga la pagina, luego se ejecuta el script -->
    <script src="js/main.js" defer></script>
</head>
<body>
    <h1 id="titulo">Introduccion a JavaScript</h1>

    <p class="mensaje">Primer parrafo</p>
    <p class="mensaje">Segundo parrafo</p>

    <p id="parrafo">Holi, soy un noble parrafo</p>

    <button id="boton">Soy un boton!</button>

    <div id="contenedor-input">
        <label for="input">Escribi algo!</label>
        <input type="text" id="input">

    </div>

    <div id="padre">
        <button id="hijo">Boton hijo</button>
    </div>

    <h4>Lista Pedidos (traidos del localStorage)</h4>
    <div id="contenedor-pedidos"></div>
    <!-- OPCION 2 / Codigo JS adentro de la etiqueta <script> (tradicionalmente antes del cierre del body) -->
    <!-- <script src="js/main.js"></script> -->

    <hr>

    <h4>Lista de usuarios de una API Rest</h4>
    <div id="contenedor-users"></div>

    <hr>

    <h4>Lista de posts de una API Rest</h4>
    <div id="contenedor-posts"></div>
</body>
</html>
